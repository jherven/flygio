services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=flygio;Username=flygio;Password=flygio
    depends_on:
      postgres:
        condition: service_healthy

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://umami:umami@postgres:5432/umami
      APP_SECRET: dev-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: flygio
      POSTGRES_USER: flygio
      POSTGRES_PASSWORD: flygio
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-umami-db.sql:/docker-entrypoint-initdb.d/init-umami-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flygio"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
